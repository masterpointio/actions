name: Lint

on:
  workflow_call: {}

permissions: {}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      actions: read # needed by trunk-action to read workflow run context
      checks: write # needed by trunk-action to write check results
      contents: read # needed by trunk-action to read repository contents
    steps:
      - name: Check out Git repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # When the caller triggers on pull_request_target, we need to pass in this ref
          # in order to lint the code from the feature branch. If the caller triggers on
          # pull_request, passing in this ref isn't necessary, but does no harm.
          ref: ${{ format('refs/pull/{0}/merge', github.event.number) }}
          # Fetch full history so Trunk can compute the PR diff against the base branch.
          # The default (fetch-depth: 1) is a shallow clone with no merge-base, which
          # would force Trunk to fetch on the fly — and that fetch would fail because
          # persist-credentials: false strips the token after the initial checkout.
          fetch-depth: 0
          persist-credentials: false
      - name: Trunk Check
        uses: glaracuente/trunk-action@1e786daed8d29494e49c19945f08646ba689ce63
        env:
          # NOTE: inject the GITHUB_TOKEN for the trunk managed tflint linter
          # https://github.com/terraform-linters/tflint/blob/master/docs/user-guide/plugins.md#avoiding-rate-limiting
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  conventional-title:
    name: conventional title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read # needed by action-semantic-pull-request to inspect pull request context
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
